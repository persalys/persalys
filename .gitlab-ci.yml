linux:
  script:
    - ./utils/build_locally.sh linux 19.1.1
  except:
    - tags

mingw:
  script:
    - ./utils/build_locally.sh mingw 19.1.1
  except:
    - tags

linux-tag:
  script:
    - ./utils/build_locally.sh linux 19.1.1
  artifacts:
    name: persalys-appimage
    paths:
      - persalys*.AppImage
    expire_in: 2 yrs
  only:
    - tags

mingw-tag:
  script:
    - ./utils/build_locally.sh mingw 19.1.1
  artifacts:
    name: persalys-exe
    paths:
      - persalys*.exe
    expire_in: 2 yrs
  only:
    - tags

fedora:
  script:
    - ./utils/build_locally.sh fedora
  except:
    - tags
